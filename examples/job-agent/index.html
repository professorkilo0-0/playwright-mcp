<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadeer's Job Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: white;
      padding: 20px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; }
    header p { font-size: 0.85rem; margin-top: 4px; opacity: 0.85; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4a5568; }

    input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      background: #f7fafc;
    }
    input:focus, select:focus { outline: none; border-color: #2b6cb0; background: white; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #2b6cb0; color: white; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; margin-top: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      text-align: center;
      padding: 12px;
      font-size: 0.9rem;
      color: #4a5568;
      display: none;
    }
    .status.visible { display: block; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #bee3f8;
      border-top-color: #2b6cb0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; }
    #results h2 { font-size: 1.1rem; margin-bottom: 12px; color: #2d3748; }

    .job-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-left: 4px solid #2b6cb0;
    }
    .job-title { font-size: 1rem; font-weight: 700; color: #1a202c; }
    .job-company { font-size: 0.85rem; color: #4a5568; margin-top: 2px; }
    .job-salary {
      display: inline-block;
      background: #c6f6d5;
      color: #276749;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 6px;
    }
    .job-location {
      display: inline-block;
      background: #bee3f8;
      color: #2a4365;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-top: 6px;
      margin-left: 4px;
    }
    .job-desc { font-size: 0.85rem; color: #718096; margin-top: 8px; line-height: 1.4; }
    .job-apply {
      display: block;
      margin-top: 10px;
      padding: 10px;
      background: #2b6cb0;
      color: white;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .error-box {
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 10px;
      padding: 14px;
      color: #c53030;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 12px;
    }
    .error-box.visible { display: block; }

    .key-hint {
      font-size: 0.75rem;
      color: #718096;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    .key-hint a { color: #2b6cb0; }
  </style>
</head>
<body>

<header>
  <h1>Kadeer's Job Finder</h1>
  <p>HR &amp; Admin jobs · Buckinghamshire · £35–45k</p>
</header>

<div class="container">

  <!-- API Key Card -->
  <div class="card" id="keyCard">
    <label for="apiKey">Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" />
    <p class="key-hint">Get yours free at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys</p>

    <label for="jobType">What type of job?</label>
    <select id="jobType">
      <option value="HR administrator or HR advisor">HR Administrator / HR Advisor</option>
      <option value="office manager or admin manager">Office Manager</option>
      <option value="care coordinator or housing officer">Care Coordinator / Housing Officer</option>
      <option value="customer service manager or team leader">Customer Service Manager</option>
      <option value="support services manager or senior support worker">Senior Support Worker</option>
    </select>

    <label for="salary">Salary range</label>
    <select id="salary">
      <option value="£35,000 to £40,000">£35,000 – £40,000</option>
      <option value="£35,000 to £45,000">£35,000 – £45,000</option>
      <option value="£40,000 to £45,000">£40,000 – £45,000</option>
    </select>

    <button class="btn btn-primary" id="searchBtn" onclick="searchJobs()">🔍 Find Jobs</button>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Status -->
  <div class="status" id="status">
    <span class="spinner"></span> Searching job boards — this takes about 30 seconds…
  </div>

  <!-- Results -->
  <div id="results">
    <h2 id="resultsHeading"></h2>
    <div id="jobList"></div>
    <button class="btn btn-secondary" onclick="resetSearch()">🔄 Search Again</button>
  </div>

</div>

<script>
  // Load saved key
  window.addEventListener('load', () => {
    const saved = localStorage.getItem('anthropic_key');
    if (saved) document.getElementById('apiKey').value = saved;
  });

  async function searchJobs() {
    const key = document.getElementById('apiKey').value.trim();
    const jobType = document.getElementById('jobType').value;
    const salary = document.getElementById('salary').value;

    if (!key || !key.startsWith('sk-ant')) {
      showError('Please enter a valid Anthropic API key (starts with sk-ant...)');
      return;
    }

    localStorage.setItem('anthropic_key', key);

    document.getElementById('searchBtn').disabled = true;
    document.getElementById('errorBox').classList.remove('visible');
    document.getElementById('status').classList.add('visible');
    document.getElementById('results').style.display = 'none';

    const prompt = `Search for ${jobType} jobs paying ${salary} in High Wycombe and Buckinghamshire, UK.

Find at least 6 real current job listings. For each job return a JSON array with this exact format:
[
  {
    "title": "Job Title",
    "company": "Company Name",
    "salary": "£X,000 - £X,000",
    "location": "Town, Buckinghamshire",
    "description": "2-sentence summary of the role",
    "url": "https://direct-link-to-job-listing"
  }
]

Only include jobs with:
- Salary between £33,000 and £47,000
- Location within 15 miles of High Wycombe
- Posted recently (2025 or 2026)

Return ONLY the JSON array, no other text.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-opus-4-6',
          max_tokens: 2048,
          tools: [{ type: 'web_search_20260209', name: 'web_search' }],
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();

      // Extract text from response
      let text = '';
      for (const block of data.content) {
        if (block.type === 'text') text += block.text;
      }

      // Parse JSON from response
      const jsonMatch = text.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('No job listings found. Try again.');

      const jobs = JSON.parse(jsonMatch[0]);
      showResults(jobs, jobType, salary);

    } catch (err) {
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      document.getElementById('searchBtn').disabled = false;
      document.getElementById('status').classList.remove('visible');
    }
  }

  function showResults(jobs, jobType, salary) {
    document.getElementById('resultsHeading').textContent = `${jobs.length} jobs found`;
    const list = document.getElementById('jobList');
    list.innerHTML = '';

    jobs.forEach(job => {
      list.innerHTML += `
        <div class="job-card">
          <div class="job-title">${job.title}</div>
          <div class="job-company">${job.company}</div>
          <span class="job-salary">${job.salary || salary}</span>
          <span class="job-location">📍 ${job.location}</span>
          <div class="job-desc">${job.description}</div>
          <a href="${job.url}" target="_blank" class="job-apply">View &amp; Apply →</a>
        </div>`;
    });

    document.getElementById('results').style.display = 'block';
    document.getElementById('keyCard').style.display = 'none';
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '⚠️ ' + msg;
    box.classList.add('visible');
  }

  function resetSearch() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('keyCard').style.display = 'block';
  }
</script>

</body>
</html>
